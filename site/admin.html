<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Brain - License 管理</title>
<style>
:root { --bg: #f8f9fa; --card: #fff; --border: #e1e4e8; --accent: #6366f1; --text: #24292f; --muted: #656d76; --ok: #1a7f37; --warn: #9a6700; --err: #cf222e; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 2rem; max-width: 960px; margin: 0 auto; }
h1 { font-size: 1.5rem; margin-bottom: 1rem; }
h2 { font-size: 1.1rem; margin: 1.5rem 0 0.75rem; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
input, button { font-size: 0.875rem; padding: 0.5rem 0.75rem; border-radius: 6px; border: 1px solid var(--border); }
input { width: 100%; max-width: 360px; }
button { cursor: pointer; border: none; color: #fff; }
.btn-primary { background: var(--accent); }
.btn-danger { background: var(--err); }
.btn-sm { font-size: 0.75rem; padding: 0.3rem 0.6rem; }
.btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; align-items: center; }
.stats { display: flex; gap: 1rem; }
.stat { text-align: center; }
.stat-num { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 0.75rem; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 500; }
.badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }
.badge-active { background: #dafbe1; color: var(--ok); }
.badge-inactive { background: #f8f8f8; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 2rem; }
.toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--text); color: #fff; padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
.login-hint { color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<h1>Second Brain License 管理</h1>

<div class="card">
  <h2>登录</h2>
  <div class="actions">
    <input type="password" id="tokenInput" placeholder="输入 Admin Token" />
    <button class="btn-primary" onclick="doLogin()">连接</button>
  </div>
  <p class="login-hint" id="loginStatus"></p>
</div>

<div id="mainPanel" style="display:none">
  <div class="card">
    <div class="stats">
      <div class="stat"><div class="stat-num" id="statTotal">-</div><div class="stat-label">总计</div></div>
      <div class="stat"><div class="stat-num" id="statActive">-</div><div class="stat-label">已激活</div></div>
      <div class="stat"><div class="stat-num" id="statInactive">-</div><div class="stat-label">未使用</div></div>
    </div>
  </div>

  <div class="card">
    <h2>生成激活码</h2>
    <div class="actions">
      <input type="text" id="batchCount" placeholder="数量 (默认 1)" style="max-width:120px" />
      <button class="btn-primary" onclick="generateKeys()">生成</button>
    </div>
    <div id="generatedKeys" style="margin-top:0.75rem;"></div>
  </div>

  <div class="card">
    <h2>激活码列表</h2>
    <div class="actions" style="margin-bottom:0.75rem;">
      <button class="btn-outline btn-sm" onclick="loadKeys()">刷新</button>
    </div>
    <table>
      <thead><tr><th>激活码</th><th>状态</th><th>来源</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody id="keyTable"></tbody>
    </table>
    <div class="empty" id="emptyHint">暂无数据</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://sb-license.ruowenwang.site';
let token = '';

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

async function api(path, opts = {}) {
  const resp = await fetch(`${API}${path}`, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token, ...opts.headers },
  });
  return resp.json();
}

async function doLogin() {
  token = document.getElementById('tokenInput').value.trim();
  if (!token) return;
  try {
    const data = await api('/admin/stats');
    if (data.error) throw new Error(data.error);
    document.getElementById('loginStatus').textContent = '连接成功';
    document.getElementById('mainPanel').style.display = '';
    document.getElementById('statTotal').textContent = data.total;
    document.getElementById('statActive').textContent = data.active;
    document.getElementById('statInactive').textContent = data.inactive;
    await loadKeys();
  } catch (e) {
    document.getElementById('loginStatus').textContent = '连接失败: ' + e.message;
  }
}

async function loadKeys() {
  const tbody = document.getElementById('keyTable');
  const empty = document.getElementById('emptyHint');
  try {
    const data = await api('/admin/list');
    if (data.error) throw new Error(data.error);
    if (!data.keys || data.keys.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';
    tbody.innerHTML = data.keys.map(k => `
      <tr>
        <td style="font-family:monospace;font-size:0.8rem">${k.key}</td>
        <td><span class="badge ${k.status === 'active' ? 'badge-active' : 'badge-inactive'}">${k.status === 'active' ? '已激活' : '未使用'}</span></td>
        <td>${k.source || '-'}</td>
        <td>${k.createdAt ? new Date(k.createdAt).toLocaleDateString('zh-CN') : '-'}</td>
        <td><button class="btn-danger btn-sm" onclick="revokeKey('${k.key}')">吊销</button></td>
      </tr>
    `).join('');
  } catch (e) {
    showToast('加载失败: ' + e.message);
  }
}

async function generateKeys() {
  const count = parseInt(document.getElementById('batchCount').value) || 1;
  const container = document.getElementById('generatedKeys');
  container.innerHTML = '';
  const keys = [];
  for (let i = 0; i < Math.min(count, 20); i++) {
    try {
      const data = await api('/generate', { method: 'POST', body: JSON.stringify({}) });
      if (data.key) keys.push(data.key);
    } catch (e) {
      showToast('生成失败: ' + e.message);
    }
  }
  if (keys.length > 0) {
    container.innerHTML = keys.map(k => `<div style="font-family:monospace;padding:0.25rem 0;color:var(--ok)">${k}</div>`).join('');
    showToast(`已生成 ${keys.length} 个激活码`);
    await loadKeys();
    // Refresh stats
    const stats = await api('/admin/stats');
    document.getElementById('statTotal').textContent = stats.total;
    document.getElementById('statActive').textContent = stats.active;
    document.getElementById('statInactive').textContent = stats.inactive;
  }
}

async function revokeKey(key) {
  if (!confirm(`确认吊销激活码 ${key}？此操作不可撤销。`)) return;
  try {
    const data = await api('/admin/revoke', { method: 'POST', body: JSON.stringify({ key }) });
    if (data.error) throw new Error(data.error);
    showToast('已吊销');
    await loadKeys();
  } catch (e) {
    showToast('吊销失败: ' + e.message);
  }
}
</script>
</body>
</html>
